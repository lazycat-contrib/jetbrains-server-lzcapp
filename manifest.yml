name: Jetbrains Server
package: czyt.app.jetbrains-server
version: 1.0.4
min_os_version: 1.3.8
description: jetbrains License Server
homepage: https://czyt.tech
author: czyt
application:
  subdomain: jetbrains-server
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://jetbra-server:10768/

services:
  jetbra-server:
    container_name: jetbra-server
{{if .U.use_rust_edition_active_server }}
    image: docker.1ms.run/czyt/jetbra:0.1.2
{{else}}
    image: docker.1ms.run/czyt/jetbrains-help:1.0.3
    binds:
      - /lzcapp/var/external:/app/external
{{end}}

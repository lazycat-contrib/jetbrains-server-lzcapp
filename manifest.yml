name: Jetbrains Server
package: czyt.app.jetbrains-server
version: 0.3.1
min_os_version: 1.3.8
description: jetbrains License Server
homepage: https://czyt.tech
author: czyt
application:
  subdomain: jetbrains-server
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://jetbra-server:8080/

services:
  jetbra-server:
    container_name: jetbra-server
    image: dockerproxy.net/czyt/jetbra-server:v0.3.1
    environment:
      - BIND_ALL=true
{{ if .U.enable_basic_auth }}
      - AUTH_USER={{.U.basic_auth_user}}
      - AUTH_PASS={{.U.basic_auth_pass}}
{{end}}

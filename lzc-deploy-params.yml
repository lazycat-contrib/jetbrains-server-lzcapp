params:
  - id: bindall
    type: bool
    name: "bind all ip address"
    description: "the jetbrains active server bind all ip address"
    default_value: true

  - id: authuser
    type: string
    name: "jetbrains active server admin username"
    description: "the jetbrains active server admin username you want to set"
    optional: true

  - id: authpass
    type: string
    name: "jetbrains active server admin password"
    description: "the jetbrains active server admin password you want to set"
    optional: true

locales:
  zh:
    bindall:
      name: "绑定所有IP地址"
      description: "是否绑定所有IP地址,默认为true,选择false可能导致程序不可用"

    authuser:
      name: "JetBrains激活服务器管理员用户名"
      description: "您要使用的JetBrains激活工具服务器管理员的用户名"

    authpass:
      name: "JetBrains激活服务器管理员密码"
      description: "您要使用的JetBrains激活工具服务器管理员密码"

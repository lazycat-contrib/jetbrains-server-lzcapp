params:
  - id: enable_basic_auth
    type: bool
    name: "enable basic auth"
    description: "enable basic auth for web"
    default_value: false

  - id: basic_auth_user
    type: string
    name: "jetbrains active server basic auth username"
    description: "the jetbrains active server basic auth username you want to set"
    optional: true

  - id: basic_auth_pass
    type: string
    name: "jetbrains active server basic auth password"
    description: "the jetbrains active server basic auth password you want to set"
    optional: true

locales:
  zh:
    enable_basic_auth:
      name: "启用Web基本身份认证"
      description: "启用Web基本身份认证"

    basic_auth_user:
      name: "JetBrains激活服务器Web基本认证用户名"
      description: "您要使用的JetBrains激活工具服务器Web基本认证的用户名"

    basic_auth_pass:
      name: "JetBrains激活服务器Web基本认证密码"
      description: "您要使用的JetBrains激活工具服务器Web基本认证密码"

# LPK v2 格式构建配置
# manifest: 指定 lpk 包的 manifest 文件路径 (v2 使用 lzc-manifest.yml)
manifest: ./lzc-manifest.yml

# pkg_id 和 pkg_name 可覆盖 package.yml 中的值（可选）
# pkg_id: czyt.app.jetbrains-server
# pkg_name: Jetbrains Server

# pkgout: lpk 包的输出路径
pkgout: ./

# contentdir: 指定打包的内容，将会打包到 lpk 中
# contentdir: ./dist

# icon: 应用图标
icon: ./icon.png
